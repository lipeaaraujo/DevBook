info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{API_URL}}/login"
  body:
    type: json
    data: |-
      {
        "email": "teste@teste.com",
        "password": "12345"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("AccessToken", res.body.token)

docs: |-
  # Login

  Authenticates a user with their email and password.

  **Auth required:** No

  ## Request body

  | Field    | Type   | Description           |
  |----------|--------|-----------------------|
  | email    | string | Registered user email |
  | password | string | User password         |

  ## Response

  Returns a JWT access token on success. The `after-response` script
  automatically stores it in the `AccessToken` variable, which the
  authenticated user requests reuse as a Bearer token.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
