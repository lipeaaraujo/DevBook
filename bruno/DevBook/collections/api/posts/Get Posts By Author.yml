info:
  name: Get Posts By Author
  type: http
  seq: 4

http:
  method: GET
  url: "{{API_URL}}/user/:authorId/post"
  params:
    - name: title
      value: ""
      type: query
      disabled: true
    - name: authorId
      value: 0c4dc840-51de-49c9-824e-2d9aa7f8f19c
      type: path
  auth:
    type: bearer
    token: "{{AccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Create User

  Registers a new user. The password is hashed before being stored.

  **Auth required:** No

  ## Request body

  | Field    | Type   | Description                  |
  |----------|--------|------------------------------|
  | name     | string | Full name                    |
  | nickname | string | Display nickname             |
  | email    | string | Unique, valid email address  |
  | password | string | Plain-text password to hash  |

  All fields are required and validated. The email must be unique and
  in a valid format.
