info:
  name: Update User
  type: http
  seq: 4

http:
  method: PUT
  url: "{{API_URL}}/users/cd0d6b36-b9ab-4b6b-abb8-18f23d8b5626"
  body:
    type: json
    data: |-
      {
        "name": "usuario editado",
        "nickname": "usuario_editado",
        "email": "teste@teste.com"
      }
  auth:
    type: bearer
    token: "{{AccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Update User

  Updates an existing user identified by their UUID in the URL path.

  **Auth required:** Yes (Bearer token)

  A user can only update their own record. The password is not required
  when updating.

  ## Request body

  | Field    | Type   | Description       |
  |----------|--------|-------------------|
  | name     | string | Full name         |
  | nickname | string | Display nickname  |
  | email    | string | Valid email       |
