info:
  name: Create User
  type: http
  seq: 1

http:
  method: POST
  url: "{{API_URL}}/users"
  body:
    type: json
    data: |-
      {
        "name": "Teste",
        "nickname": "testenick",
        "email": "teste14@teste.com",
        "password": "12345"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Create User

  Registers a new user. The password is hashed before being stored.

  **Auth required:** No

  ## Request body

  | Field    | Type   | Description                  |
  |----------|--------|------------------------------|
  | name     | string | Full name                    |
  | nickname | string | Display nickname             |
  | email    | string | Unique, valid email address  |
  | password | string | Plain-text password to hash  |

  All fields are required and validated. The email must be unique and
  in a valid format.
