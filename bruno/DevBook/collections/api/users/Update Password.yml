info:
  name: Update Password
  type: http
  seq: 8

http:
  method: POST
  url: "{{API_URL}}/users/:id/change-password"
  params:
    - name: id
      value: 155c7622-deb9-4c7d-95c5-06cc718cb8ff
      type: path
  body:
    type: json
    data: |-
      {
        "currentPassword": "12345",
        "newPassword": "12345678"
      }
  auth:
    type: bearer
    token: "{{AccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Delete User

  Deletes an existing user identified by their UUID in the URL path.

  **Auth required:** Yes (Bearer token)

  A user can only delete their own record.
