info:
  name: Get Users
  type: http
  seq: 2

http:
  method: GET
  url: "{{API_URL}}/users"
  auth:
    type: bearer
    token: "{{AccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get Users

  Returns the list of registered users.

  **Auth required:** Yes (Bearer token)

  Run the **Login** request first so the `AccessToken` variable is set;
  it is sent automatically as the Bearer token.
