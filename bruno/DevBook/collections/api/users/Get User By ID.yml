info:
  name: Get User By ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{API_URL}}/users/:id"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{AccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get User By ID

  Returns a single user identified by their UUID in the URL path.

  **Auth required:** Yes (Bearer token)

  Replace the UUID in the URL with the id of an existing user.
